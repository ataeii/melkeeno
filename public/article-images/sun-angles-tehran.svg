<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" direction="rtl" font-family="Vazirmatn, Tahoma, 'Noto Sans Arabic', sans-serif">
  <rect width="800" height="440" fill="#f8fafc"/>
  <text x="400" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#1e3a5f">زاویه‌ی خورشید ظهر در تهران (۳۵٫۷° شمالی) — نمای مقطع یک اتاق رو به جنوب</text>
  <!-- sky/outdoor and floor -->
  <rect x="0" y="330" width="800" height="70" fill="#e5e7eb"/>
  <rect x="250" y="130" width="450" height="200" fill="#fffdf5" stroke="#9ca3af" stroke-width="2"/>
  <!-- south wall with window opening -->
  <rect x="244" y="130" width="12" height="40" fill="#6b7280"/>
  <rect x="244" y="290" width="12" height="40" fill="#6b7280"/>
  <rect x="246" y="170" width="8" height="120" fill="#bae6fd" stroke="#38bdf8"/>
  <!-- ceiling/roof slab and overhang -->
  <rect x="210" y="122" width="490" height="8" fill="#4b5563"/>
  <!-- winter patch of sun on the floor -->
  <rect x="317" y="326" width="199" height="6" fill="#f59e0b"/>
  <!-- winter rays (31 deg) -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="none">
    <line x1="70" y1="61.8" x2="516" y2="330"/>
    <line x1="70" y1="122" x2="416" y2="330"/>
    <line x1="70" y1="182" x2="317" y2="330"/>
  </g>
  <!-- summer rays (78 deg), stopped by the overhang -->
  <g stroke="#ef4444" stroke-width="2.5">
    <line x1="222" y1="40" x2="239.8" y2="122"/>
    <line x1="170" y1="40" x2="214.3" y2="122" />
  </g>
  <g stroke="#ef4444" stroke-width="3">
    <line x1="232" y1="114" x2="248" y2="122"/>
    <line x1="206" y1="114" x2="222" y2="122"/>
  </g>
  <!-- labels -->
  <text x="150" y="358" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">خورشید ظهر زمستان ≈ ۳۱°</text>
  <text x="150" y="376" font-size="12" fill="#b45309" text-anchor="middle">(کم‌ارتفاع؛ تا عمق اتاق می‌تابد)</text>
  <text x="470" y="78" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="middle">خورشید ظهر تابستان ≈ ۷۸°</text>
  <text x="470" y="98" font-size="12" fill="#b91c1c" text-anchor="middle">(تقریباً از بالا؛ سایه‌بان جلوش را می‌گیرد)</text>
  <text x="150" y="148" font-size="12" fill="#374151" text-anchor="middle">سایه‌بان یا بالکن کم‌عمق</text>
  <text x="205" y="241" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="bold">پنجره‌ی جنوبی</text>
  <text x="520" y="318" font-size="12" fill="#92400e" text-anchor="middle">لکه‌ی آفتاب زمستان روی کف</text>
  <text x="400" y="405" font-size="14" fill="#1e3a5f" font-weight="bold" text-anchor="middle">◄ جنوب (سمت پنجره)</text>
  <text x="690" y="358" font-size="14" fill="#1e3a5f" font-weight="bold" text-anchor="middle">شمال ►</text>
  <text x="400" y="425" font-size="11" fill="#6b7280" text-anchor="middle">طرح تقریبی برای توضیح؛ ارتفاع خورشید = ۹۰° − عرض جغرافیایی ± ۲۳٫۴۴° — خانه‌دِه</text>
</svg>
